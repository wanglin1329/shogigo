# SPDX-License-Identifier: GPL-3.0-only
# Tests gate the deploy (docs/PLAN.md §6.6): nothing ships unless typecheck,
# tests, build checks and the secret scan all pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # `build` also runs scripts/check-build.mjs (SSR routes not prerendered,
      # _headers and GPL engine files present, no secrets in client assets).
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          # Hidden files are needed (dist/client/_headers); a local .dev.vars
          # copy must never ship (CI has none, but guard anyway).
          path: |
            dist
            !dist/server/.dev.vars
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: check
    # Enabled once the D1 database exists and its database_id is in
    # wrangler.jsonc (repository variable DEPLOY_ENABLED=true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # CLOUDFLARE_API_TOKEN: least privilege (Workers Scripts, D1, Durable
      # Objects edit on this account only). Runtime secrets such as TOKEN_SECRET
      # are set once with `wrangler secret put` and are not handled here.
      # The Vite plugin writes the deployable config to dist/server/wrangler.json
      # (locally it is found via the gitignored .wrangler/deploy redirect).
      - run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
